[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackjack-computer-vision"
version = "0.1.0"
description = "Real-time Blackjack assistant using classical computer vision"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
notebooks = ["ipykernel>=6", "matplotlib>=3.8"]
# YOLO card detector. On a PC without an NVIDIA GPU install the CPU build of PyTorch first:
# pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
yolo = ["ultralytics>=8.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"blackjack_vision.ui" = ["*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
